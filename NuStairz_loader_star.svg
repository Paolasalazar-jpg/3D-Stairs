<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -120 240 240" width="240" height="240">
  <style>
    .star {
      fill: #53AFB9;
      transform-origin: 0 0;
      animation: flip 0.8s infinite;
    }
    /* spins on its vertical axis, like a coin; fades when edge-on */
    @keyframes flip {
      0%   { transform: scaleX(1);  opacity: 1;    animation-timing-function: cubic-bezier(0.36,0,0.64,0.36); }
      50%  { transform: scaleX(0);  opacity: 0.45; animation-timing-function: cubic-bezier(0.36,0.64,0.64,1); }
      100% { transform: scaleX(-1); opacity: 1; }
    }
  </style>
  <path class="star" d="M0,-79 Q10.3,-10.3 79,0 Q10.3,10.3 0,79 Q-10.3,10.3 -79,0 Q-10.3,-10.3 0,-79 Z"/>
</svg>
